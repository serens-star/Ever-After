<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Swipe - Ever After</title>
    <link rel="stylesheet" href="css/cardswipe.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Courgett&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="cardswipe-page">
    <header class="cardswipe-header">
      <button class="settings-btn" aria-label="Search criteria settings">
        <img src="assets/Settings_Icon.png" alt="Settings" class="icon" />
      </button>
      <h1 class="cardswipe-title">Cardswipe</h1>
      <button class="matches-btn" aria-label="View matches">
        <img
          src="assets/Card_Swipe_Icon.png"
          alt="Card Swipe"
          class="icon matches-icon"
        />
      </button>
    </header>

    <main class="cardswipe-main">
      <section class="subtitle-section">
        <h2>All Your Connections!</h2>
      </section>

      <section class="swipe-container">
        <div class="polaroid-card">
          <img
            src="assets/Card_Swipe.png"
            alt="Profile Card"
            class="card-image"
          />
          <div class="card-info">
            <h3 class="profile-name">Elaina (She/They), 23</h3>
            <p class="distance-info">
              <span id="distance-text">Calculating distance...</span>
              <span id="location-text"></span>
            </p>
          </div>
        </div>

        <div class="swipe-buttons">
          <button class="swipe-btn reject-btn" aria-label="Reject">
            <span class="swipe-icon">✕</span>
          </button>
          <button class="swipe-btn accept-btn" aria-label="Accept">
            <span class="swipe-icon">♥</span>
          </button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="nearby.html" class="nav-btn">
        <img src="assets/EverAfter_Logo.png" alt="Matches" class="nav-icon" />
        <span class="nav-label">Matches</span>
      </a>
      <a href="cardswipe.html" class="nav-btn active">
        <img
          src="assets/Card_Swipe_Icon.png"
          alt="Card Swipe"
          class="nav-icon"
        />
        <span class="nav-label">Card Swipe</span>
      </a>
      <a href="inbox.html" class="nav-btn">
        <img src="assets/Inbox_Icon.png" alt="Inbox" class="nav-icon" />
        <span class="nav-label">Inbox</span>
      </a>
      <a href="profile.html" class="nav-btn">
        <img src="assets/Profile_Icon.png" alt="Profile" class="nav-icon" />
        <span class="nav-label">Profile</span>
      </a>
    </nav>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/cardswipe.js"></script>
  </body>
</html>
