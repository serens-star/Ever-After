<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat - Ever After</title>
    <link rel="stylesheet" href="css/chat.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Courgett&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="chat-page">
    <header class="chat-header">
      <a href="inbox.html" class="back-btn">
        <span class="btn-text">←</span>
      </a>
      <div class="chat-partner-info">
        <img id="partnerAvatar" src="" alt="Profile" class="partner-avatar" />
        <div class="partner-details">
          <h2 id="partnerName" class="partner-name"></h2>
          <span id="partnerStatus" class="partner-status">Online</span>
        </div>
      </div>
      <button class="menu-btn">
        <span class="btn-text">⋮</span>
      </button>
    </header>

    <main class="chat-main">
      <div class="messages-container" id="messagesContainer">
        <!-- Messages -->
      </div>
    </main>

    <footer class="chat-footer">
      <div class="message-input-container">
        <input
          type="text"
          id="messageInput"
          placeholder="Type a message..."
          class="message-input"
        />
        <button id="sendButton" class="send-btn">
          <span class="btn-text">➤</span>
        </button>
      </div>
    </footer>

    <script src="js/chat.js"></script>
  </body>
</html>
