<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ever After | Log In</title>
    <meta name="author" content="Seren Mafunda" />
    <meta
      name="description"
      content="Log in to Ever After, a dating app for queer individuals."
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  </head>
  <body class="login-page">
    <main>
      <header class="form-header">
        <h1 class="logo-text small" aria-label="Ever After">
          <span class="logo-left">Ever</span>
          <img
            src="assets/EverAfter_Logo.png"
            alt="Ever After Logo"
            class="logo-img small"
          />
          <span class="logo-right">After</span>
        </h1>
        <h2 class="form-title">Welcome Back</h2>
      </header>

      <form id="login-form" class="auth-form" autocomplete="on">
        <div class="form-group">
          <label for="username">Name</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your name"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="keepLoggedIn" />
            <span class="checkmark"></span>
            Keep Me Logged In
          </label>
          <button type="button" class="forgot-btn" id="forgotPasswordBtn">
            Forgot Password?
          </button>
        </div>

        <button type="submit" class="submit-btn">Log In</button>
      </form>

      <div class="back-link">
        <a href="signin.html">← Back to Welcome</a>
      </div>
    </main>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
      <div class="modal-content">
        <h3>Reset Password</h3>
        <p>
          Enter your email address and we'll send you a link to reset your
          password.
        </p>
        <div class="form-group">
          <input type="email" id="reset-email" placeholder="Enter your email" />
        </div>
        <div class="modal-actions">
          <button id="sendResetBtn" class="submit-btn">Send Reset Link</button>
          <button id="cancelResetBtn" class="cancel-btn">Cancel</button>
        </div>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
