<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ever After | Welcome</title>
    <meta name="author" content="Seren Mafunda" />
    <meta
      name="description"
      content="Welcome to Ever After, a dating app for queer individuals."
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  </head>
  <body class="welcome-page">
    <main>
      <header class="welcome-header">
        <h1 class="logo-text" aria-label="Ever After">
          <span class="logo-left">Ever</span>
          <img
            src="assets/EverAfter_Logo.png"
            alt="Ever After Logo"
            class="logo-img"
          />
          <span class="logo-right">After</span>
        </h1>
        
      </header>

      <section class="welcome-actions">
        <div class="action-section">
          <h2>Don't Have an Account?</h2>
          <a href="signup.html" class="action-btn signup-btn">Sign Up</a>
        </div>

        <div class="action-section">
          <h2>Already Have an Account?</h2>

          <a href="login.html" class="action-btn login-btn">Log In</a>
        </div>
      </section>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
